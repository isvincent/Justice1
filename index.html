const $=id=>document.getElementById(id);const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const load=(k,f)=>{try{return JSON.parse(localStorage.getItem(k))??f}catch{return f}};const state=load('justice-study-v1',{unit:0,notes:{},answers:{},reflections:{},decisions:{},weights:{},scores:{},role:{}});let settings=load('justice-settings-v1',{sound:true,device:'auto',layout:'auto',lang:'zh',font:'normal',theme:'system'});let currentQuiz=0;let soundCtx;let announced=false;const persist=()=>{localStorage.setItem('justice-study-v1',JSON.stringify(state));updateProgress()};const say=s=>{const t=$('toast');t.textContent=s;t.classList.add('show');clearTimeout(t._timer);t._timer=setTimeout(()=>t.classList.remove('show'),2300)};function sound(){if(!settings.sound)return;try{soundCtx=soundCtx||new(window.AudioContext||window.webkitAudioContext)();const o=soundCtx.createOscillator(),g=soundCtx.createGain();o.type='sine';o.frequency.setValueAtTime(660,soundCtx.currentTime);o.frequency.exponentialRampToValueAtTime(880,soundCtx.currentTime+.09);g.gain.setValueAtTime(.025,soundCtx.currentTime);g.gain.exponentialRampToValueAtTime(.001,soundCtx.currentTime+.13);o.connect(g);g.connect(soundCtx.destination);o.start();o.stop(soundCtx.currentTime+.14)}catch{}}

function reflectionRecord(i){const r=state.reflections[i]||{};return `單元${i+1}：${U[i].title}\n同意程度：${r.stance||3}/5\n立場：${r.reason||''}\n反對意見：${r.counter||''}\n修正：${r.revision||''}`}
function unitRecord(i){const u=U[i],correct=u.quiz.filter((q,j)=>state.answers[i+'-'+j]===q[2]).length,done=u.quiz.filter((q,j)=>state.answers[i+'-'+j]!==undefined).length;return `《正義：一場思辨之旅》\n單元 ${i+1}：${u.title}\n測驗：${correct*20} 分（已答 ${done}/5 題）\n\n`+phases.map(([p,question],j)=>`${p}\n${question}\n${state.notes[i+'-'+j]||'未作答'}`).join('\n\n')+'\n\n'+reflectionRecord(i)}
async function copyText(s){try{await navigator.clipboard.writeText(s)}catch{const t=document.createElement('textarea');t.value=s;document.body.appendChild(t);t.select();document.execCommand('copy');t.remove()}}function downloadText(name,content){const b=new Blob(['\ufeff',content],{type:'text/plain;charset=utf-8'}),url=URL.createObjectURL(b),a=document.createElement('a');a.href=url;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);say('檔案已產生')}
$('saveBtn').onclick=()=>{const record='《正義：一場思辨之旅》｜完整學習紀錄\n匯出時間：'+new Date().toLocaleString()+'\n\n'+U.map((_,i)=>unitRecord(i)).join('\n\n'+'='.repeat(32)+'\n\n');downloadText('justice-learning-record.txt',record);sound()};applySettings();render();
</script></body></html>
